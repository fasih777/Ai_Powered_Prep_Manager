services:
  # FastAPI Backend Service
  - type: web
    name: prep-manager-backend
    env: docker
    plan: free
    dockerContext: .
    dockerfilePath: Dockerfile
    envVars:
      - key: REDIS_URL
        fromService:
          type: redis
          name: prep-manager-redis
          property: connectionString
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  # Celery Background Worker — processes async prep-review jobs
  - type: worker
    name: prep-manager-worker
    env: docker
    plan: free
    dockerContext: .
    dockerfilePath: Dockerfile
    dockerCommand: celery -A backend.worker worker --loglevel=info -Q prep_review.default,prep_review.priority
    envVars:
      - key: REDIS_URL
        fromService:
          type: redis
          name: prep-manager-redis
          property: connectionString
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  # Redis Service
  - type: redis
    name: prep-manager-redis
    plan: free
    maxmemoryPolicy: allkeys-lru

  # Next.js Frontend Service (deployed on Vercel — this is a fallback Docker option)
  - type: web
    name: prep-manager-frontend
    env: docker
    plan: free
    dockerContext: ./frontend
    dockerfilePath: Dockerfile
    envVars:
      - key: PYTHON_API_URL
        value: https://prep-manager-backend.onrender.com
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
