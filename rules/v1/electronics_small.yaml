rule_set_id: prep-electronics-v1
version: "2026.09.1"
category: electronics_small
description: Authoritative packaging and labeling rules for small consumer electronics
effective_date: "2026-09-01T00:00:00Z"
checks:
  - check_id: polybag_presence
    name: Polybag presence
    description: Unit must be enclosed in a protective transparent polybag
    visually_verifiable: true
    evidence_key: polybag_presence
    pass_values: [present]
    fail_values: [missing]
    min_confidence: 0.80
  - check_id: polybag_sealing
    name: Polybag sealing
    description: Polybag opening must be completely sealed via heat-seal or tape
    visually_verifiable: true
    evidence_key: polybag_seal
    pass_values: [sealed, heat_sealed, taped]
    fail_values: [open, unsealed]
    min_confidence: 0.80
  - check_id: suffocation_warning_presence
    name: Suffocation warning presence
    description: Printed suffocation warning is mandatory on polybags with opening >= 5 inches
    visually_verifiable: true
    evidence_key: suffocation_warning
    pass_values: [present]
    fail_values: [missing]
    min_confidence: 0.85
  - check_id: warning_legibility
    name: Warning visibility and legibility
    description: Suffocation warning text must be clean, legible, and unoccluded
    visually_verifiable: true
    evidence_key: suffocation_warning_legibility
    pass_values: [legible, clear]
    fail_values: [illegible, obscured]
    min_confidence: 0.85
  - check_id: fnsku_placement
    name: FNSKU label placement
    description: FNSKU label must be affixed flat on the packaging exterior
    visually_verifiable: true
    evidence_key: fnsku_placement
    pass_values: [flat, proper]
    fail_values: [missing, misplaced]
    min_confidence: 0.80
  - check_id: fnsku_surface
    name: FNSKU appropriate surface
    description: FNSKU label must not be placed across seams, curved edges, or openings
    visually_verifiable: true
    evidence_key: fnsku_surface
    pass_values: [flat]
    fail_values: [seam, curved_edge, opening]
    min_confidence: 0.80
  - check_id: manufacturer_barcode_covered
    name: Original manufacturer barcode covered
    description: Original manufacturer UPC/EAN barcode must be fully covered
    visually_verifiable: true
    evidence_key: manufacturer_barcode
    pass_values: [covered]
    fail_values: [visible, uncovered, partially_visible]
    min_confidence: 0.85
  - check_id: expiry_date_visibility
    name: Expiry-date visibility
    description: Expiry date if applicable must be clearly visible and scannable
    visually_verifiable: true
    evidence_key: expiry_date
    pass_values: [visible, legible, not_applicable]
    fail_values: [covered, missing]
    min_confidence: 0.85
  - check_id: handling_marks
    name: Required handling marks
    description: Required battery or handling iconography must be present
    visually_verifiable: true
    evidence_key: handling_marks
    pass_values: [present, not_required]
    fail_values: [missing]
    min_confidence: 0.80
  - check_id: bag_material_thickness
    name: Polybag material thickness (1.5 mil)
    description: Polybag must meet minimum 1.5 mil thickness standard (non-visual specification)
    visually_verifiable: false
    evidence_key: bag_material_thickness
    pass_values: []
    fail_values: []
    min_confidence: 1.0
